[project]
name = "seamline"
version = "0.1.0"
description = "Shared, cross-service session memory for Claude Code"
readme = "README.md"
authors = [
    { name = "Vamshidhar Pandrapagada", email = "25401978+vamshidhar-pandrapagada@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2.0",
]

[project.scripts]
seamline = "seamline.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
