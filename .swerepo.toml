[values]
project = "seamline"
adr_dir = "docs/adr"
progress_dir = "docs/progress"
commands = "- Install: `uv sync`\n- Test: `uv run pytest`\n- Lint: `uv run ruff check .` and `uv run ruff format --check .`\n- Check the standard: `swerepo check`"
