python = ["3.12", "3.13", "3.14"]
ci_install = "uv sync --locked"
lint = "ruff"
governance_command = ""
ci_copilot_review = "true"
code_owner = "@vamshidhar-pandrapagada"

[agents]
hosts = ["claude", "cursor", "vscode", "antigravity", "gemini"]

[tools]
seamspec = "0.1.2"

[github]
copilot_review = true
applied = false

[pr]
enforce = false
warn_since = 2026-11-26

